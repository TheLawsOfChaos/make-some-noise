name: Test (PR)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build (type check included)
        working-directory: frontend
        run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preview version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "## Version Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Versions come from versions.json and bump on merge; a \`frontend:x.y.z\` or \`backend:x.y.z\` token in the merge commit message overrides them." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- frontend: \`$(jq -r .frontend versions.json)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- backend: \`$(jq -r .backend versions.json)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR title: $PR_TITLE" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # PR builds use their own cache scope so a pull request cannot seed the
      # cache that the publish workflow reads.
      - name: Build backend image (test only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: makesomenoise-backend:test
          cache-from: type=gha,scope=pr-backend
          cache-to: type=gha,mode=max,scope=pr-backend

      - name: Build frontend image (test only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: makesomenoise-frontend:test
          cache-from: type=gha,scope=pr-frontend
          cache-to: type=gha,mode=max,scope=pr-frontend
